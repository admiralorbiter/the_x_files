[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovon"
version = "0.1.0"
description = "Optimal Volunteer Observation Network - Human-Aware Route-Constrained Adaptive Sampling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "duckdb>=0.9.0",
    "polars>=0.19.0",
    "scikit-learn>=1.0.0",
    "geopandas>=0.12.0",
    "networkx>=2.8.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "shapely>=2.0.0",
    "streamlit>=1.25.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ovon = "ovon.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

