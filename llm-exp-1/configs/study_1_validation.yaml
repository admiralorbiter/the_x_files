# IMPACT Study 1 — UniMoral Validation Run
# 6 scenarios × 9 treatments × 2 models × 2 option orders = 216 cells
#
# Purpose: Validate the UniMoral corpus + instrument integration before
# the 2,304-cell production run.
#
# Pass/fail gates:
#   - ~100% technical completion & JSON parsing
#   - >90% semantic order stability
#   - Neutral controls close to B0
#   - Active treatments clearly target the intended semantic action
#   - No bizarre institutional language
#   - Human probabilities correctly traced from Selected_action

run_name: study1_unimoral_validation
dataset_name: scruples
data_dir: data
results_dir: results/runs
adapter_mode: production
scenario_source: production
scenario_file: validation_scenarios.json
num_scenarios: 6
replicates_per_cell: 1
counterbalance_option_order: true
protocols:
  - version_j
paraphrase_ids:
  - p0_default
exclude_treatments:
  - R2_relevant_evidence
ollama_base_url: http://localhost:11434
timeout_seconds: 120.0

models:
  - model_name: qwen3:14b
    temperature: 0.7
    top_p: 0.9
    max_tokens: 300
    seed: 42
  - model_name: gemma4:12b
    temperature: 0.7
    top_p: 0.9
    max_tokens: 300
    seed: 42
